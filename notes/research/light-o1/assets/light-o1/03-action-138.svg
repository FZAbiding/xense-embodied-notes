<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="138 维人体动作：表征维度不是电机自由度"><title>138 维人体动作：表征维度不是电机自由度</title><desc>右手系、Y 向上；字段定义必须与单位、旋转行列约定和时间语义一起使用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53718e"/></marker></defs><rect width="1600" height="1080" fill="#fff"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="40" y="58" font-size="34" font-weight="700" text-anchor="start" fill="#102a43"><tspan x="40" dy="0">138 维人体动作：表征维度不是电机自由度</tspan></text><text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" fill="#526a80"><tspan x="40" dy="0">右手系、Y 向上；字段定义必须与单位、旋转行列约定和时间语义一起使用。</tspan></text><rect x="40" y="155" width="960" height="570" rx="18" fill="#f4f8fc" stroke="#bfd0e2" stroke-width="2"/><text x="75" y="203" font-size="29" font-weight="650" text-anchor="start" fill="#173b5c"><tspan x="75" dy="0">每帧布局：138 = 2 + 1 + 1 + 22 × 6 + 2</tspan></text><text x="75" y="270" font-size="24" font-weight="650" text-anchor="start" fill="#2c6389"><tspan x="75" dy="0">0:2</tspan></text><text x="255" y="270" font-size="24" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="255" dy="0">根节点局部 XZ 位移</tspan></text><text x="790" y="270" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="790" dy="0">米 / 帧</tspan></text><text x="75" y="335" font-size="24" font-weight="650" text-anchor="start" fill="#2c6389"><tspan x="75" dy="0">2:3</tspan></text><text x="255" y="335" font-size="24" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="255" dy="0">骨盆高度</tspan></text><text x="790" y="335" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="790" dy="0">米</tspan></text><text x="75" y="400" font-size="24" font-weight="650" text-anchor="start" fill="#2c6389"><tspan x="75" dy="0">3:4</tspan></text><text x="255" y="400" font-size="24" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="255" dy="0">朝向变化</tspan></text><text x="790" y="400" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="790" dy="0">弧度 / 帧</tspan></text><text x="75" y="465" font-size="24" font-weight="650" text-anchor="start" fill="#2c6389"><tspan x="75" dy="0">4:136</tspan></text><text x="255" y="465" font-size="24" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="255" dy="0">22 个父节点局部 6D 旋转</tspan></text><text x="790" y="465" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="790" dy="0">132 个数</tspan></text><text x="75" y="530" font-size="24" font-weight="650" text-anchor="start" fill="#2c6389"><tspan x="75" dy="0">136:138</tspan></text><text x="255" y="530" font-size="24" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="255" dy="0">左右手各一个张开量</tspan></text><text x="790" y="530" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="790" dy="0">0…1</tspan></text><text x="75" y="625" font-size="24" font-weight="400" text-anchor="start" fill="#754d2b"><tspan x="75" dy="0">6D 旋转：用冗余参数稳定表达三维旋转。</tspan><tspan x="75" dy="34.8">两只手张开量：不包含逐指独立关节和接触力。</tspan></text><rect x="1040" y="155" width="520" height="570" rx="18" fill="#faf8f2" stroke="#d5c8a7" stroke-width="2"/><text x="1300" y="205" font-size="27" font-weight="650" text-anchor="middle" fill="#6c5834"><tspan x="1300" dy="0">人体骨架教学示意</tspan></text><g fill="none" stroke="#6b84a2" stroke-width="11" stroke-linecap="round"><circle cx="1300" cy="295" r="42"/><path d="M1300 337 L1300 490 M1205 380 L1395 380 M1205 380 L1145 455 L1115 510 M1395 380 L1455 455 L1485 510 M1300 490 L1235 565 L1205 655 M1300 490 L1365 565 L1395 655"/></g><text x="1300" y="703" font-size="21" font-weight="400" text-anchor="middle" fill="#7a6849"><tspan x="1300" dy="0">不是目标机器人标定骨架</tspan></text><rect x="55" y="790" width="290" height="150" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="200" y="832" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="200" dy="0">138 维动作</tspan></text><text x="200" y="873" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="200" dy="0">人体运动描述</tspan><tspan x="200" dy="30.45">不是直接关节命令</tspan></text><rect x="445" y="790" width="290" height="150" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="590" y="832" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="590" dy="0">FK / 坐标转换</tspan></text><text x="590" y="873" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="590" dy="0">恢复三维关节轨迹</tspan><tspan x="590" dy="30.45">检查左右与轴向</tspan></text><rect x="835" y="790" width="290" height="150" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="980" y="832" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="980" dy="0">适配 + 控制器</tspan></text><text x="980" y="873" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="980" dy="0">可达性、限位、反馈</tspan><tspan x="980" dy="30.45">身体参数与动态</tspan></text><rect x="1225" y="790" width="290" height="150" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="1370" y="832" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="1370" dy="0">机器人执行</tspan></text><text x="1370" y="873" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="1370" dy="0">接触、稳定与任务结果</tspan><tspan x="1370" dy="30.45">需要独立评估</tspan></text><path d="M345 865 L445 865" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M735 865 L835 865" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1125 865 L1225 865" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="995" font-size="24" font-weight="400" text-anchor="start" fill="#334e68"><tspan x="55" dy="0">共享动作空间能提高复用性；任务对象、逐指动作和力信息仍需其他输入或模块补足。</tspan></text><text x="40" y="1050" font-size="19" font-weight="400" text-anchor="start" fill="#647b8e"><tspan x="40" dy="0">原创教学示意 · 调研日期 2026-10-20 · 框大小不表示参数量或执行时长</tspan></text></g></svg>
