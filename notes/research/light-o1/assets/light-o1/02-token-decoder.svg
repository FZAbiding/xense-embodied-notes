<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Preview：共享主干不等于统一输出 softmax"><title>Preview：共享主干不等于统一输出 softmax</title><desc>代码中的动作 embedding、动作输出矩阵、FSM 和外部动作解码器是不同组件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53718e"/></marker></defs><rect width="1600" height="1080" fill="#fff"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="40" y="58" font-size="34" font-weight="700" text-anchor="start" fill="#102a43"><tspan x="40" dy="0">Preview：共享主干不等于统一输出 softmax</tspan></text><text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" fill="#526a80"><tspan x="40" dy="0">代码中的动作 embedding、动作输出矩阵、FSM 和外部动作解码器是不同组件。</tspan></text><rect x="55" y="180" width="240" height="145" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="175" y="222" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="175" dy="0">文本 / 动作 id</tspan></text><text x="175" y="263" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="175" dy="0">动作有独立编号范围</tspan><tspan x="175" dy="30.45">不是关节角直接输入</tspan></text><rect x="370" y="180" width="285" height="145" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="512.5" y="222" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="512.5" dy="0">选择对应 embedding</tspan></text><text x="512.5" y="263" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="512.5" dy="0">text embedding</tspan><tspan x="512.5" dy="30.45">motion_embeddings</tspan></text><rect x="730" y="180" width="300" height="145" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="880" y="222" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="880" dy="0">Qwen3.5 共享主干</tspan></text><text x="880" y="263" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="880" dy="0">处理一条逻辑序列</tspan><tspan x="880" dy="30.45">混合注意力 ≠ MoE</tspan></text><rect x="1120" y="150" width="370" height="125" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="1305" y="192" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="1305" dy="0">文本输出矩阵</tspan></text><text x="1305" y="233" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="1305" dy="0">文本阶段输出</tspan></text><rect x="1120" y="300" width="370" height="125" rx="18" fill="#e8f7ef" stroke="#bfd0e2" stroke-width="2"/><text x="1305" y="342" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="1305" dy="0">motion_head</tspan></text><text x="1305" y="383" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="1305" dy="0">动作阶段输出</tspan></text><path d="M295 250 L370 250" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M655 250 L730 250" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1030 250 L1070 250 L1070 215 L1120 215" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1030 250 L1070 250 L1070 365 L1120 365" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><rect x="1100" y="480" width="410" height="100" rx="18" fill="#fff4e9" stroke="#e3bf94" stroke-width="2"/><text x="1305" y="520" font-size="23" font-weight="650" text-anchor="middle" fill="#79502b"><tspan x="1305" dy="0">FSM：当前允许哪类输出</tspan></text><text x="1305" y="554" font-size="20" font-weight="400" text-anchor="middle" fill="#79502b"><tspan x="1305" dy="0">分别归一化的头需要合法切换</tspan></text><path d="M1305 425 L1305 480" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1490 212 L1540 212 L1540 530 L1510 530" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="470" font-size="25" font-weight="650" text-anchor="start" fill="#244c70"><tspan x="70" dy="0">同一条自回归序列：</tspan><tspan x="70" dy="36.25">文字解释 → 动作开始 → 动作内容 → 动作结束</tspan></text><text x="70" y="555" font-size="23" font-weight="400" text-anchor="start" fill="#52697c"><tspan x="70" dy="0">协议合法 ≠ 身体平衡 / 可达 / 无碰撞</tspan><tspan x="70" dy="33.35">因果动作 Decoder 使用当前和历史 latent。</tspan></text><path d="M1100 530 L1020 530 L1020 630 L165 630 L165 690" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="690" width="250" height="165" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="165" y="732" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="165" dy="0">动作全局 id</tspan></text><text x="165" y="773" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="165" dy="0">去除动作结束标记</tspan><tspan x="165" dy="30.45">减去 id 偏移 248082</tspan></text><rect x="355" y="690" width="250" height="165" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="480" y="732" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="480" dy="0">本地码本 id</tspan></text><text x="480" y="773" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="480" dy="0">范围 0…65535</tspan><tspan x="480" dy="30.45">每个内容码一帧</tspan></text><rect x="670" y="690" width="250" height="165" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="795" y="732" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="795" dy="0">FSQ latent</tspan></text><text x="795" y="773" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="795" dy="0">四维 × 每维 16 档</tspan><tspan x="795" dy="30.45">总组合 16⁴ = 65536</tspan></text><rect x="985" y="690" width="250" height="165" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="1110" y="732" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="1110" dy="0">因果卷积网络</tspan></text><text x="1110" y="773" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="1110" dy="0">恢复内部 139 维</tspan><tspan x="1110" dy="30.45">再还原为最终 138 维</tspan></text><rect x="1300" y="690" width="250" height="165" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="1425" y="732" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="1425" dy="0">人体轨迹</tspan></text><text x="1425" y="773" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="1425" dy="0">20 FPS</tspan><tspan x="1425" dy="30.45">需要另接适配 / 控制</tspan></text><path d="M290 772 L355 772" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M605 772 L670 772" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M920 772 L985 772" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1235 772 L1300 772" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="930" font-size="23" font-weight="400" text-anchor="start" fill="#334e68"><tspan x="65" dy="0">动作输入 / 输出矩阵约 335.6M 参数（按配置推导）；卷积动作 Decoder 约 142.2M。</tspan><tspan x="65" dy="33.35">上述两者均不等同于 π0.5 的连续动作专家 Transformer。</tspan></text><text x="40" y="1050" font-size="19" font-weight="400" text-anchor="start" fill="#647b8e"><tspan x="40" dy="0">原创教学示意 · 调研日期 2026-10-20 · 框大小不表示参数量或执行时长</tspan></text></g></svg>
