<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Light-O1 评测：每类结果回答不同的问题"><title>Light-O1 评测：每类结果回答不同的问题</title><desc>预测质量、语义符合、仿真操作与真机可靠性需要各自的协议和证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53718e"/></marker></defs><rect width="1600" height="1080" fill="#fff"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="40" y="58" font-size="34" font-weight="700" text-anchor="start" fill="#102a43"><tspan x="40" dy="0">Light-O1 评测：每类结果回答不同的问题</tspan></text><text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" fill="#526a80"><tspan x="40" dy="0">预测质量、语义符合、仿真操作与真机可靠性需要各自的协议和证据。</tspan></text><text x="60" y="166" font-size="26" font-weight="650" text-anchor="start" fill="#173b5c"><tspan x="60" dy="0">证据类型</tspan></text><text x="430" y="166" font-size="26" font-weight="650" text-anchor="start" fill="#173b5c"><tspan x="430" dy="0">实际观察到什么</tspan></text><text x="1015" y="166" font-size="26" font-weight="650" text-anchor="start" fill="#173b5c"><tspan x="1015" dy="0">解释边界</tspan></text><rect x="40" y="195" width="1520" height="165" rx="18" fill="#f0f6fc" stroke="#bfd0e2" stroke-width="2"/><text x="70" y="245" font-size="25" font-weight="650" text-anchor="start" fill="#264c70"><tspan x="70" dy="0">开环姿态预测</tspan><tspan x="70" dy="36.25">MPJPE / token loss</tspan></text><text x="430" y="245" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="430" dy="0">给定历史条件的短期预测</tspan><tspan x="430" dy="33.35">局部对齐、best-of-four 等协议</tspan></text><text x="1015" y="245" font-size="22" font-weight="400" text-anchor="start" fill="#765334"><tspan x="1015" dy="0">不能换算成单次执行成功率</tspan><tspan x="1015" dy="31.9">注意真值前缀和候选选择</tspan></text><rect x="40" y="385" width="1520" height="165" rx="18" fill="#f5f4fc" stroke="#c7c2df" stroke-width="2"/><text x="70" y="435" font-size="25" font-weight="650" text-anchor="start" fill="#524476"><tspan x="70" dy="0">动作语义评价</tspan><tspan x="70" dy="36.25">人评 / VLM 评审</tspan></text><text x="430" y="435" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="430" dy="0">运动是否符合文字描述</tspan><tspan x="430" dy="33.35">表现力、可接受性等</tspan></text><text x="1015" y="435" font-size="22" font-weight="400" text-anchor="start" fill="#765334"><tspan x="1015" dy="0">语义正确不保证平衡或接触</tspan><tspan x="1015" dy="31.9">评分对象可能是渲染动作</tspan></text><rect x="40" y="575" width="1520" height="165" rx="18" fill="#f0faf4" stroke="#afcfbd" stroke-width="2"/><text x="70" y="625" font-size="25" font-weight="650" text-anchor="start" fill="#2f6847"><tspan x="70" dy="0">仿真任务</tspan><tspan x="70" dy="36.25">RoboCasa GR-1</tspan></text><text x="430" y="625" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="430" dy="0">固定数据和任务集中的完成率</tspan><tspan x="430" dy="33.35">厂商报告宏平均 79.3%</tspan></text><text x="1015" y="625" font-size="22" font-weight="400" text-anchor="start" fill="#765334"><tspan x="1015" dy="0">不是现实家庭通用成功率</tspan><tspan x="1015" dy="31.9">基线配方与来源需要核对</tspan></text><rect x="40" y="765" width="1520" height="165" rx="18" fill="#fff7ed" stroke="#dfc9ac" stroke-width="2"/><text x="70" y="815" font-size="25" font-weight="650" text-anchor="start" fill="#7e592f"><tspan x="70" dy="0">真实机器人演示</tspan><tspan x="70" dy="36.25">行为与任务视频</tspan></text><text x="430" y="815" font-size="23" font-weight="400" text-anchor="start" fill="#19324d"><tspan x="430" dy="0">具体场景中出现了哪些行为</tspan><tspan x="430" dy="33.35">可作为能力线索</tspan></text><text x="1015" y="815" font-size="22" font-weight="400" text-anchor="start" fill="#765334"><tspan x="1015" dy="0">还需全部尝试、失败和介入记录</tspan><tspan x="1015" dy="31.9">不能从精选视频得出可靠性</tspan></text><text x="65" y="995" font-size="26" font-weight="650" text-anchor="start" fill="#244762"><tspan x="65" dy="0">比较不同模型时，统一输入、动作空间、控制器、数据预算与评测环境。</tspan></text><text x="40" y="1050" font-size="19" font-weight="400" text-anchor="start" fill="#647b8e"><tspan x="40" dy="0">原创教学示意 · 调研日期 2026-10-20 · 框大小不表示参数量或执行时长</tspan></text></g></svg>
