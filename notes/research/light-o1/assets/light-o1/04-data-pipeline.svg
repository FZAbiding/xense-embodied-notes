<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="从互联网视频到可学习动作：监督是恢复出来的"><title>从互联网视频到可学习动作：监督是恢复出来的</title><desc>公开步骤与工程推断分开；下方列出需要验证的质量问题，未指称厂商使用特定实现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53718e"/></marker></defs><rect width="1600" height="1080" fill="#fff"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="40" y="58" font-size="34" font-weight="700" text-anchor="start" fill="#102a43"><tspan x="40" dy="0">从互联网视频到可学习动作：监督是恢复出来的</tspan></text><text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" fill="#526a80"><tspan x="40" dy="0">公开步骤与工程推断分开；下方列出需要验证的质量问题，未指称厂商使用特定实现。</tspan></text><text x="45" y="167" font-size="27" font-weight="650" text-anchor="start" fill="#244b70"><tspan x="45" dy="0">公开方法层面的处理链</tspan></text><rect x="40" y="205" width="240" height="180" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="160" y="247" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="160" dy="0">已有视频</tspan></text><text x="160" y="288" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="160" dy="0">多视角 / 多场景</tspan><tspan x="160" dy="30.45">不等于全是 ego</tspan></text><rect x="300" y="205" width="240" height="180" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="420" y="247" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="420" dy="0">清洗与切分</tspan></text><text x="420" y="288" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="420" dy="0">连续动作片段</tspan><tspan x="420" dy="30.45">去除不适合片段</tspan></text><rect x="560" y="205" width="240" height="180" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="680" y="247" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="680" dy="0">检测与跟踪</tspan></text><text x="680" y="288" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="680" dy="0">跨帧同一个人</tspan><tspan x="680" dy="30.45">维持动作连续性</tspan></text><rect x="820" y="205" width="240" height="180" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="940" y="247" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="940" dy="0">三维动作恢复</tspan></text><text x="940" y="288" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="940" dy="0">身体与根轨迹</tspan><tspan x="940" dy="30.45">存在重建误差</tspan></text><rect x="1080" y="205" width="240" height="180" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="1200" y="247" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="1200" dy="0">语言与时间对齐</tspan></text><text x="1200" y="288" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="1200" dy="0">细粒度动作描述</tspan><tspan x="1200" dy="30.45">观察和动作同步</tspan></text><rect x="1340" y="205" width="220" height="180" rx="18" fill="#eef5fc" stroke="#bfd0e2" stroke-width="2"/><text x="1450" y="247" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="1450" dy="0">统一动作码</tspan></text><text x="1450" y="288" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="1450" dy="0">表示与 tokenizer</tspan><tspan x="1450" dy="30.45">进入序列预训练</tspan></text><path d="M280 295 L300 295" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M540 295 L560 295" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 295 L820 295" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1060 295 L1080 295" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1320 295 L1340 295" fill="none" stroke="#53718e" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="470" font-size="26" font-weight="650" text-anchor="start" fill="#86532e"><tspan x="45" dy="0">本文建议关注的质量门槛：以下不是已披露的内部阈值</tspan></text><rect x="40" y="510" width="465" height="170" rx="18" fill="#fff5e9" stroke="#bfd0e2" stroke-width="2"/><text x="272.5" y="552" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="272.5" dy="0">来源与去重</tspan></text><text x="272.5" y="593" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="272.5" dy="0">同一视频转载 / 镜像 / 剪辑</tspan><tspan x="272.5" dy="30.45">按原视频、人物与场景隔离评测</tspan></text><rect x="565" y="510" width="465" height="170" rx="18" fill="#fff5e9" stroke="#bfd0e2" stroke-width="2"/><text x="797.5" y="552" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="797.5" dy="0">几何与接触</tspan></text><text x="797.5" y="593" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="797.5" dy="0">相机运动、尺度、脚滑和遮挡</tspan><tspan x="797.5" dy="30.45">手腕正确不等于抓住了物体</tspan></text><rect x="1090" y="510" width="470" height="170" rx="18" fill="#fff5e9" stroke="#bfd0e2" stroke-width="2"/><text x="1325" y="552" font-size="25" font-weight="650" text-anchor="middle" fill="#12304b"><tspan x="1325" dy="0">时间与动作契约</tspan></text><text x="1325" y="593" font-size="21" font-weight="400" text-anchor="middle" fill="#41576b"><tspan x="1325" dy="0">帧率、单位、轴向和左右一致</tspan><tspan x="1325" dy="30.45">语言覆盖正确的动作时间段</tspan></text><rect x="40" y="735" width="1520" height="260" rx="18" fill="#f0f8f4" stroke="#aacdb9" stroke-width="2"/><text x="70" y="780" font-size="27" font-weight="650" text-anchor="start" fill="#295a42"><tspan x="70" dy="0">训练规模的五个口径必须分开记录</tspan></text><text x="75" y="840" font-size="27" font-weight="400" text-anchor="start" fill="#355846"><tspan x="75" dy="0">潜在互联网视频池 ≠ 已处理库存 ≠ 清洗后独立动作小时</tspan><tspan x="75" dy="39.15">训练消费 token ≠ 唯一视频数；后训练机器人数据 ≠ 人体预训练小时</tspan><tspan x="75" dy="39.15">周吞吐描述基础设施能力，不能直接加到模型训练数据量上。</tspan></text><text x="40" y="1050" font-size="19" font-weight="400" text-anchor="start" fill="#647b8e"><tspan x="40" dy="0">原创教学示意 · 调研日期 2026-10-20 · 框大小不表示参数量或执行时长</tspan></text></g></svg>
