<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="从观察到动作：OpenPI / π0.5"><title>从观察到动作：OpenPI / π0.5</title><desc>原创教学图｜观察编码与连续动作生成在多层注意力中连接</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#475569}</style><rect width="1440" height="860" fill="white"/><text x="40" y="52" class="title">从观察到动作：OpenPI / π0.5</text><text x="40" y="88" class="small">原创教学图｜观察编码与连续动作生成在多层注意力中连接</text><g><rect x="40" y="130" width="420" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="250" y="175" text-anchor="middle" dominant-baseline="middle" class="label">多视角图像</text><text x="250" y="205" text-anchor="middle" dominant-baseline="middle" class="body">视觉编码器 → patch 特征</text></g><g><rect x="510" y="130" width="420" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="720" y="175" text-anchor="middle" dominant-baseline="middle" class="label">指令与状态</text><text x="720" y="205" text-anchor="middle" dominant-baseline="middle" class="body">语言 token / 状态编码</text></g><g><rect x="980" y="130" width="420" height="120" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1190" y="175" text-anchor="middle" dominant-baseline="middle" class="label">高斯噪声 + 去噪时间</text><text x="1190" y="205" text-anchor="middle" dominant-baseline="middle" class="body">动作 chunk 的生成起点</text></g><g><rect x="40" y="355" width="640" height="170" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="360" y="410" text-anchor="middle" dominant-baseline="middle" class="label">VLM 条件 prefix</text><text x="360" y="440" text-anchor="middle" dominant-baseline="middle" class="body">图像、语言、状态表征</text><text x="360" y="470" text-anchor="middle" dominant-baseline="middle" class="body">每层产生条件 K / V</text></g><g><rect x="760" y="355" width="640" height="170" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1080" y="410" text-anchor="middle" dominant-baseline="middle" class="label">Action Expert suffix</text><text x="1080" y="440" text-anchor="middle" dominant-baseline="middle" class="body">带噪动作读取条件与动作特征</text><text x="1080" y="470" text-anchor="middle" dominant-baseline="middle" class="body">预测连续动作向量场</text></g><g><rect x="440" y="650" width="620" height="110" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="750" y="690" text-anchor="middle" dominant-baseline="middle" class="label">动作 chunk → 执行接口</text><text x="750" y="720" text-anchor="middle" dominant-baseline="middle" class="body">反归一化、坐标映射、队列与控制器</text></g><path d="M250 250 L250 355" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M720 250 L500 355" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1190 250 L1190 355" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M680 440 L760 440" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1080 525 L900 650" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="780" y="575" class="small">多次去噪复用本次观察的条件 K / V</text><text x="40" y="827" class="small">注意：本次观察内的 KV 缓存，不等于跨分钟的任务记忆；本图未画出可选 FAST 训练分支。</text></svg>
