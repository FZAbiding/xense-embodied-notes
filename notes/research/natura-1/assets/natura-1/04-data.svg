<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="从人类经验到机器人可用的训练信号"><title>从人类经验到机器人可用的训练信号</title><desc>原创流程图｜蓝绿框依据公开数据链路，虚线框为尚待核实的迁移细节</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#475569}</style><rect width="1440" height="860" fill="white"/><text x="40" y="52" class="title">从人类经验到机器人可用的训练信号</text><text x="40" y="88" class="small">原创流程图｜蓝绿框依据公开数据链路，虚线框为尚待核实的迁移细节</text><g><rect x="40" y="130" width="390" height="130" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="235" y="180" text-anchor="middle" dominant-baseline="middle" class="label">受控采集</text><text x="235" y="210" text-anchor="middle" dominant-baseline="middle" class="body">单目 / 双目 / 多相机 / 腕部</text></g><g><rect x="40" y="320" width="390" height="130" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="235" y="370" text-anchor="middle" dominant-baseline="middle" class="label">互联网 ego 视频</text><text x="235" y="400" text-anchor="middle" dominant-baseline="middle" class="body">扩大任务与场景覆盖</text></g><g><rect x="510" y="130" width="390" height="130" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="705" y="180" text-anchor="middle" dominant-baseline="middle" class="label">清洗与筛选</text><text x="705" y="210" text-anchor="middle" dominant-baseline="middle" class="body">去重、完整性、质量与手可见性</text></g><g><rect x="510" y="320" width="390" height="130" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="705" y="370" text-anchor="middle" dominant-baseline="middle" class="label">运动重建 + 语言标注</text><text x="705" y="400" text-anchor="middle" dominant-baseline="middle" class="body">手 / 身体运动；目标 / 子任务</text></g><g><rect x="1010" y="200" width="390" height="170" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1205" y="255" text-anchor="middle" dominant-baseline="middle" class="label">视频—语言—动作轨迹</text><text x="1205" y="285" text-anchor="middle" dominant-baseline="middle" class="body">时间对齐、任务与场景元数据</text><text x="1205" y="315" text-anchor="middle" dominant-baseline="middle" class="body">采样与训练</text></g><g><rect x="40" y="610" width="860" height="145" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="470" y="652.5" text-anchor="middle" dominant-baseline="middle" class="label">覆盖分析 → 调整采集与采样</text><text x="470" y="682.5" text-anchor="middle" dominant-baseline="middle" class="body">任务分类与供应商方案匹配；补充薄弱分布</text><text x="470" y="712.5" text-anchor="middle" dominant-baseline="middle" class="body">Kubernetes 处理；Lakehouse 管理数据</text></g><g><rect x="1010" y="610" width="390" height="145" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="1205" y="652.5" text-anchor="middle" dominant-baseline="middle" class="label">迁移到机器人还需确认</text><text x="1205" y="682.5" text-anchor="middle" dominant-baseline="middle" class="body">坐标、动作表征、形态对齐</text><text x="1205" y="712.5" text-anchor="middle" dominant-baseline="middle" class="body">接触与目标硬件数据</text></g><path d="M430 195 L510 195" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M430 385 L510 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M705 260 L705 320" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M900 385 L1010 300" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1010 330 L800 610" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1205 370 L1205 610" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="827" class="small">小时数需区分原始、去重、训练保留与处理吞吐；本图不证明 Natura 使用了任一指定开源重建器。</text></svg>
