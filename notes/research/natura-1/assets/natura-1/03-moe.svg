<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="MoE 的专家，与 Action Expert 的“专家”"><title>MoE 的专家，与 Action Expert 的“专家”</title><desc>标准稀疏 MoE 教学图｜专家数量和 top-k 均为示例，不代表 Natura-1</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#475569}</style><rect width="1440" height="860" fill="white"/><text x="40" y="52" class="title">MoE 的专家，与 Action Expert 的“专家”</text><text x="40" y="88" class="small">标准稀疏 MoE 教学图｜专家数量和 top-k 均为示例，不代表 Natura-1</text><g><rect x="40" y="160" width="350" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="215" y="205" text-anchor="middle" dominant-baseline="middle" class="label">某一层的 token 特征</text><text x="215" y="235" text-anchor="middle" dominant-baseline="middle" class="body">来自视频、动作或语言</text></g><g><rect x="535" y="160" width="370" height="120" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="720" y="205" text-anchor="middle" dominant-baseline="middle" class="label">路由器 Router</text><text x="720" y="235" text-anchor="middle" dominant-baseline="middle" class="body">本例选择 4 个专家中的 2 个</text></g><g><rect x="1040" y="130" width="360" height="105" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1220" y="167.5" text-anchor="middle" dominant-baseline="middle" class="label">专家 A</text><text x="1220" y="197.5" text-anchor="middle" dominant-baseline="middle" class="body">本 token 激活</text></g><g><rect x="1040" y="280" width="360" height="105" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="1220" y="317.5" text-anchor="middle" dominant-baseline="middle" class="label">专家 B</text><text x="1220" y="347.5" text-anchor="middle" dominant-baseline="middle" class="body">本 token 未激活</text></g><g><rect x="1040" y="430" width="360" height="105" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1220" y="467.5" text-anchor="middle" dominant-baseline="middle" class="label">专家 C</text><text x="1220" y="497.5" text-anchor="middle" dominant-baseline="middle" class="body">本 token 激活</text></g><g><rect x="1040" y="580" width="360" height="105" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="1220" y="617.5" text-anchor="middle" dominant-baseline="middle" class="label">专家 D</text><text x="1220" y="647.5" text-anchor="middle" dominant-baseline="middle" class="body">本 token 未激活</text></g><g><rect x="40" y="540" width="860" height="165" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="470" y="592.5" text-anchor="middle" dominant-baseline="middle" class="label">专家输出加权组合 → 后续网络层</text><text x="470" y="622.5" text-anchor="middle" dominant-baseline="middle" class="body">不同 token 和不同层可以选择不同专家</text><text x="470" y="652.5" text-anchor="middle" dominant-baseline="middle" class="body">单 token 激活少量参数 ≠ 全部权重只需存少量</text></g><path d="M390 220 L535 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M905 200 L1040 180" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M905 240 L1040 480" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1100 235 L800 540" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1040 480 L900 580" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="827" class="small">OpenPI 的 Action Expert 按模态承担连续动作生成，不能直接对应本图中的某个稀疏 FFN 专家。</text></svg>
