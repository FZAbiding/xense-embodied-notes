<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="Natura-1：统一序列与视频—动作联合生成"><title>Natura-1：统一序列与视频—动作联合生成</title><desc>原创概念图｜公开方向与未披露细节分开；并非精确网络配置</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#475569}</style><rect width="1440" height="860" fill="white"/><text x="40" y="52" class="title">Natura-1：统一序列与视频—动作联合生成</text><text x="40" y="88" class="small">原创概念图｜公开方向与未披露细节分开；并非精确网络配置</text><g><rect x="40" y="135" width="320" height="135" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="200" y="187.5" text-anchor="middle" dominant-baseline="middle" class="label">语言意图</text><text x="200" y="217.5" text-anchor="middle" dominant-baseline="middle" class="body">定义目标与约束</text></g><g><rect x="410" y="135" width="440" height="135" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="630" y="187.5" text-anchor="middle" dominant-baseline="middle" class="label">历史视觉 / 动作信息</text><text x="630" y="217.5" text-anchor="middle" dominant-baseline="middle" class="body">为下一时段提供条件</text></g><g><rect x="900" y="135" width="500" height="135" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1150" y="187.5" text-anchor="middle" dominant-baseline="middle" class="label">未来视频与动作变量</text><text x="1150" y="217.5" text-anchor="middle" dominant-baseline="middle" class="body">联合去噪学习的目标</text></g><g><rect x="220" y="370" width="1000" height="155" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="720" y="417.5" text-anchor="middle" dominant-baseline="middle" class="label">共享 MoE Transformer</text><text x="720" y="447.5" text-anchor="middle" dominant-baseline="middle" class="body">按时间组织轨迹；通过注意力形成条件依赖</text><text x="720" y="477.5" text-anchor="middle" dominant-baseline="middle" class="body">视频目标与动作目标联合训练</text></g><g><rect x="40" y="650" width="420" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="250" y="695" text-anchor="middle" dominant-baseline="middle" class="label">未来视频表征</text><text x="250" y="725" text-anchor="middle" dominant-baseline="middle" class="body">世界变化的预测</text></g><g><rect x="510" y="650" width="420" height="120" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="720" y="695" text-anchor="middle" dominant-baseline="middle" class="label">未来动作表征</text><text x="720" y="725" text-anchor="middle" dominant-baseline="middle" class="body">供实际执行链使用</text></g><g><rect x="980" y="650" width="420" height="120" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="1190" y="695" text-anchor="middle" dominant-baseline="middle" class="label">未披露的实现细节</text><text x="1190" y="725" text-anchor="middle" dominant-baseline="middle" class="body">编码器、激活参数、采样步数</text></g><path d="M200 270 L430 370" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M630 270 L720 370" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1150 270 L1010 370" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M430 525 L250 650" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M720 525 L720 650" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="827" class="small">不据此推定特定 VAE、块内双向掩码、动作维度、上下文长度，也不推定部署必解码 RGB 视频。</text></svg>
