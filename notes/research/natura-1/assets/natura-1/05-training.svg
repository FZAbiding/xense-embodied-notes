<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="预训练、机器人适配与任务专项调优"><title>预训练、机器人适配与任务专项调优</title><desc>原创阶段图｜“相对本次任务零样本”不等于“从未使用机器人数据”</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:21px}.small{font-size:18px;fill:#475569}</style><rect width="1440" height="860" fill="white"/><text x="40" y="52" class="title">预训练、机器人适配与任务专项调优</text><text x="40" y="88" class="small">原创阶段图｜“相对本次任务零样本”不等于“从未使用机器人数据”</text><g><rect x="40" y="170" width="400" height="180" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="240" y="230" text-anchor="middle" dominant-baseline="middle" class="label">人类经验预训练</text><text x="240" y="260" text-anchor="middle" dominant-baseline="middle" class="body">广泛视觉、语言与运动经验</text><text x="240" y="290" text-anchor="middle" dominant-baseline="middle" class="body">学习可迁移的先验</text></g><g><rect x="520" y="170" width="400" height="180" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="720" y="230" text-anchor="middle" dominant-baseline="middle" class="label">机器人后训练 / 适配</text><text x="720" y="260" text-anchor="middle" dominant-baseline="middle" class="body">目标硬件、动作接口与轨迹</text><text x="720" y="290" text-anchor="middle" dominant-baseline="middle" class="body">公开数据预算仍不明确</text></g><g><rect x="1000" y="170" width="400" height="180" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1200" y="230" text-anchor="middle" dominant-baseline="middle" class="label">基础能力测试</text><text x="1200" y="260" text-anchor="middle" dominant-baseline="middle" class="body">未见任务 / 物体 / 场景组合</text><text x="1200" y="290" text-anchor="middle" dominant-baseline="middle" class="body">依发布方规定的隔离口径</text></g><g><rect x="520" y="560" width="400" height="170" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="720" y="630" text-anchor="middle" dominant-baseline="middle" class="label">额外任务调优</text><text x="720" y="660" text-anchor="middle" dominant-baseline="middle" class="body">提高特定长程工作流表现</text></g><g><rect x="1000" y="560" width="400" height="170" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1200" y="615" text-anchor="middle" dominant-baseline="middle" class="label">六项长程任务展示</text><text x="1200" y="645" text-anchor="middle" dominant-baseline="middle" class="body">包馄饨、贴膜等</text><text x="1200" y="675" text-anchor="middle" dominant-baseline="middle" class="body">不能当成纯任务零样本结果</text></g><path d="M440 260 L520 260" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M920 260 L1000 260" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M720 350 L720 560" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M920 645 L1000 645" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="827" class="small">公司具备 RL 研发能力、推理时发生重试、模型采用某种特定 RL 配方，是三个不同命题。</text></svg>
