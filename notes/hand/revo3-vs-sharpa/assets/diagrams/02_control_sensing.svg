<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#8094a4"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif}</style>
<rect x="0" y="0" width="1500" height="1050" rx="0" fill="#eef3f7" stroke="none"/>
<text x="48" y="61" font-size="34" fill="#142d43" text-anchor="start" font-weight="700">控制与感知：同样叫 MIT，物理量并不相同</text>
<text x="48" y="100" font-size="18" fill="#566d80" text-anchor="start" font-weight="400">接口示意，不是电路接线图｜电流估算、根部力矩传感与指尖触觉需要分开理解</text>
<rect x="48" y="145" width="1404" height="354" rx="16" fill="#ffffff" stroke="none"/>
<text x="72" y="189" font-size="27" fill="#2768ba" text-anchor="start" font-weight="700">Revo 3 · SDK 2.x</text>
<rect x="72" y="218" width="316" height="132" rx="16" fill="#eef7fb" stroke="none"/>
<text x="90" y="253" font-size="22" fill="#2768ba" text-anchor="start" font-weight="700">上位机 / 策略</text>
<text x="90" y="292" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">位置、速度、阻抗目标</text>
<text x="90" y="322" font-size="16" fill="#566d80" text-anchor="start" font-weight="400">需自行处理时序与超时</text>
<line x1="390" y1="280" x2="414" y2="280" stroke="#8094a4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="418" y="218" width="316" height="132" rx="16" fill="#eef7fb" stroke="none"/>
<text x="436" y="253" font-size="22" fill="#2768ba" text-anchor="start" font-weight="700">对外控制接口</text>
<text x="436" y="292" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">前馈：mA 电流</text>
<text x="436" y="322" font-size="16" fill="#566d80" text-anchor="start" font-weight="400">Kp / Kd：设备系数</text>
<line x1="736" y1="280" x2="760" y2="280" stroke="#8094a4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="764" y="218" width="316" height="132" rx="16" fill="#f0f4f7" stroke="none"/>
<text x="782" y="253" font-size="22" fill="#566d80" text-anchor="start" font-weight="700">执行机构内部</text>
<text x="782" y="292" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">电机 → 传动 → 输出</text>
<text x="782" y="322" font-size="16" fill="#566d80" text-anchor="start" font-weight="400">Kt、减速比、效率未核实</text>
<line x1="1082" y1="280" x2="1106" y2="280" stroke="#8094a4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1110" y="218" width="316" height="132" rx="16" fill="#eef7fb" stroke="none"/>
<text x="1128" y="253" font-size="22" fill="#2768ba" text-anchor="start" font-weight="700">接触物体</text>
<text x="1128" y="292" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">指尖 / 指腹 / 掌面</text>
<text x="1128" y="322" font-size="16" fill="#566d80" text-anchor="start" font-weight="400">接触力受姿态与摩擦影响</text>
<line x1="1403" y1="366" x2="90" y2="366" stroke="#8094a4" stroke-width="3" marker-end="url(#arrow)"/>
<text x="90" y="403" font-size="20" fill="#2768ba" text-anchor="start" font-weight="700">关节反馈：位置 / 速度 / 电流等；没有已标定 N·m 模型。</text>
<text x="90" y="439" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">触觉另行配置：U21 无；U21F 指尖三维力；U21T 全掌压阻；U21VT 压阻 + 视触觉。</text>
<text x="90" y="472" font-size="17" fill="#566d80" text-anchor="start" font-weight="400">工业总线可选 RS-485 / CAN FD / EtherCAT；EtherCAT 使用独立集成通路。</text>
<rect x="48" y="530" width="1404" height="354" rx="16" fill="#ffffff" stroke="none"/>
<text x="72" y="574" font-size="27" fill="#007f79" text-anchor="start" font-weight="700">Sharpa Wave · 官方手册</text>
<rect x="72" y="603" width="316" height="132" rx="16" fill="#eef7fb" stroke="none"/>
<text x="90" y="638" font-size="22" fill="#007f79" text-anchor="start" font-weight="700">上位机 / 策略</text>
<text x="90" y="677" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">位置、导纳、MIT 等</text>
<text x="90" y="707" font-size="16" fill="#566d80" text-anchor="start" font-weight="400">500 Hz 关节状态接口</text>
<line x1="390" y1="665" x2="414" y2="665" stroke="#8094a4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="418" y="603" width="316" height="132" rx="16" fill="#eef7fb" stroke="none"/>
<text x="436" y="638" font-size="22" fill="#007f79" text-anchor="start" font-weight="700">对外控制接口</text>
<text x="436" y="677" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">前馈：N·m 力矩</text>
<text x="436" y="707" font-size="16" fill="#566d80" text-anchor="start" font-weight="400">默认力矩反馈由电流估算</text>
<line x1="736" y1="665" x2="760" y2="665" stroke="#8094a4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="764" y="603" width="316" height="132" rx="16" fill="#f0f4f7" stroke="none"/>
<text x="782" y="638" font-size="22" fill="#566d80" text-anchor="start" font-weight="700">执行机构内部</text>
<text x="782" y="677" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">电机 → 传动 → 输出</text>
<text x="782" y="707" font-size="16" fill="#566d80" text-anchor="start" font-weight="400">减速比、FOC 频率未核实</text>
<line x1="1082" y1="665" x2="1106" y2="665" stroke="#8094a4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1110" y="603" width="316" height="132" rx="16" fill="#eef7fb" stroke="none"/>
<text x="1128" y="638" font-size="22" fill="#007f79" text-anchor="start" font-weight="700">接触物体</text>
<text x="1128" y="677" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">五指尖视触觉</text>
<text x="1128" y="707" font-size="16" fill="#566d80" text-anchor="start" font-weight="400">6D 接触输出 ≠ 关节力矩</text>
<line x1="1403" y1="751" x2="90" y2="751" stroke="#8094a4" stroke-width="3" marker-end="url(#arrow)"/>
<text x="90" y="788" font-size="20" fill="#007f79" text-anchor="start" font-weight="700">根部：5 个传感器组件；四指 MCP 与拇指 CMC 可切换为传感器力矩反馈。</text>
<text x="90" y="824" font-size="19" fill="#142d43" text-anchor="start" font-weight="400">指尖：五个视触觉传感器；原始图像、形变与接触信息走另一条感知链路。</text>
<text x="90" y="857" font-size="17" fill="#566d80" text-anchor="start" font-weight="400">不是 22 轴各有独立力矩传感器；触觉高帧率也不等于所有处理输出同频率。</text>
<rect x="48" y="932" width="1404" height="68" rx="16" fill="#fff4e6" stroke="none"/>
<text x="72" y="960" font-size="21" fill="#bc680c" text-anchor="start" font-weight="700">2 ms = 500 Hz 接口周期；5.56 ms = 180 fps 图像间隔。它们都不是内部电流环周期。</text>
<text x="72" y="987" font-size="18" fill="#566d80" text-anchor="start" font-weight="400">Wave 高性能模式的手册延迟为 20 ms；稳定力控仍需考虑采样、传输、处理及滤波的总延迟。</text>
<text x="48" y="1030" font-size="14" fill="#566d80" text-anchor="start" font-weight="400">资料：BrainCo REVO3_MOTOR_API；Sharpa Wave 手册第 11、28–30、96 页。研究整理 / 2026-09-22</text>
</svg>